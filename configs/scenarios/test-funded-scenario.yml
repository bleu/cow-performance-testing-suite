# Test Scenario with Wallet Funding
# This configuration will generate 2 traders and fund them automatically

network:
  chain_id: 1
  rpc_url: "http://localhost:8545" # Anvil fork
  settlement_contract: "0x9008D19f58AAbD9eD0D60971565AA8510560ab41"
  composable_cow_contract: "0xfdaFc9d1902f4e0b84f65F49f244b32b31013b74"
  vault_relayer: "0xC92E8bdf79f0507f65a392b0ab4667716BFE0110"

api:
  base_url: "http://localhost:8080"
  timeout: 30
  max_retries: 3

output:
  format: "table"
  verbose: true
  save_results: true
  results_dir: "./test-results"

wallet:
  generate_count: 10 # Generate 2 new wallets
  funding_enabled: true # Enable automatic funding
  eth_balance: 10.0 # 10 ETH per wallet for gas
  token_balances:
    WETH: 5.0 # 5 WETH per wallet
    DAI: 5000.0 # 5,000 DAI per wallet
    USDC: 5000.0 # 5,000 USDC per wallet

default_trader_count: 10
default_duration: 60
default_startup_interval: 0.5

# Only use market orders for this test (simpler)
market_order_ratio: 0.5
limit_order_ratio: 0.5
twap_order_ratio: 0.0
stop_loss_order_ratio: 0.0
good_after_time_order_ratio: 0.0

# Order cleanup configuration
order_cleanup:
  enabled: true
  max_open_orders_per_wallet: 5
  cleanup_batch_size: 3
  cleanup_strategy: "oldest_first"
  check_interval: 2.0
