name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.7.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      - name: Install project
        run: poetry install --no-interaction

      - name: Create .env file for docker-compose
        run: |
          echo "ETH_RPC_URL=${{ secrets.ETH_RPC_URL }}" > .env
        if: ${{ secrets.ETH_RPC_URL != '' }}

      - name: Start docker-compose services
        run: |
          docker compose up -d
          echo "Waiting for services to be ready..."
          sleep 60
        if: ${{ secrets.ETH_RPC_URL != '' }}

      - name: Check service health
        run: |
          docker compose ps
          curl --retry 10 --retry-delay 5 --retry-connrefused http://localhost:8080/api/v1/version || true
        if: ${{ secrets.ETH_RPC_URL != '' }}

      - name: Run tests (with E2E)
        run: |
          poetry run pytest tests/ -v --cov=src/cow_performance --cov-report=xml --cov-report=term-missing
        if: ${{ secrets.ETH_RPC_URL != '' }}

      - name: Run tests (without E2E)
        run: |
          poetry run pytest tests/ -v -m "not e2e" --cov=src/cow_performance --cov-report=xml --cov-report=term-missing
        if: ${{ secrets.ETH_RPC_URL == '' }}

      - name: Stop docker-compose services
        run: docker compose down -v
        if: ${{ always() && secrets.ETH_RPC_URL != '' }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.7.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run Black
        run: poetry run black --check src/ tests/

      - name: Run Ruff
        run: poetry run ruff check src/ tests/

      - name: Run MyPy
        run: poetry run mypy src/

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.7.1

      - name: Build package
        run: poetry build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
